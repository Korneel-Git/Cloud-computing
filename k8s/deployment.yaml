apiVersion: apps/v1
kind: Deployment

metadata:
  name: storingsmelder
  labels:
    app: storingsmelder

spec:
  replicas: 2

  selector:
    matchLabels:
      app: storingsmelder

  template:
    metadata:
      labels:
        app: storingsmelder

    spec:
      containers:
      - name: storingsmelder
        image: ghcr.io/korneel-git/storingsmelder:1.1
        ports:
        - containerPort: 8000