apiVersion: apps/v1
kind: Deployment

metadata:
  name: db

spec:
  replicas: 1

  selector:
    matchLabels:
      app: db

  template:
    metadata:
      labels:
        app: db

    spec:
      containers:
      - name: postgres
        image: postgres:18

        env:
        - name: POSTGRES_USER
          value: "storingsmelder"

        - name: POSTGRES_PASSWORD
          value: "wachtwoord123"

        - name: POSTGRES_DB
          value: "storingsmelder"

        ports:
        - containerPort: 5432