services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://storingsmelder:wachtwoord123@db:5432/storingsmelder
    volumes:
      - storingsmelder-data:/data
    depends_on:
      - db
    restart: on-failure

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  storingsmelder-data:
  postgres-data: